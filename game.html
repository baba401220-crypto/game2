<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>拉麵掉落店｜開始遊戲</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff8ef;color:#2b2118}
.wrap{max-width:900px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.back{color:inherit;text-decoration:none;font-weight:800}
.panel{background:#fff;border:1px solid #eadfd2;border-radius:18px;padding:15px;margin-top:12px}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#fff0dc;padding:9px 13px;border-radius:11px;font-weight:800}
#field{height:430px;position:relative;overflow:hidden;background:linear-gradient(#f2f6f7,#dfe8ea);border-radius:18px;border:1px solid #d9e0e2;margin-top:12px}
.food{position:absolute;top:-50px;background:none;border:0;font-size:36px;cursor:pointer;padding:4px;touch-action:manipulation}
.bowl{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:65px;pointer-events:none}
.order{display:flex;gap:8px;flex-wrap:wrap}.tag{padding:6px 9px;background:#f7f2ec;border-radius:9px}.done{text-decoration:line-through;opacity:.45}
button{min-height:44px;border:1px solid #d9c9b8;border-radius:12px;background:#fff;padding:9px 14px;font-weight:800;cursor:pointer}.primary{background:#e87535;color:#fff;border-color:#e87535}
#skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.skill{border:1px solid #eadfd2;border-radius:14px;padding:12px}
.small{font-size:13px;color:#76695e}.msg{min-height:25px;font-weight:800;text-align:center;margin:8px}
</style></head>
<body><div class="wrap">
<div class="top"><a class="back" href="index.html">← 回首頁</a><h2>🍜 拉麵掉落店</h2></div>
<div class="panel"><div class="stats"><span class="stat">🪙 金幣：<b id="coins">25</b></span><span class="stat">🍜 完成：<b id="served">0</b></span></div></div>
<div class="panel"><b>👤 顧客訂單</b><div id="order" class="order" style="margin-top:8px"></div></div>
<div id="field"><div class="bowl">🍜</div></div>
<div class="msg" id="msg" aria-live="polite">點擊掉落的食材來收集！</div>
<div class="panel"><button class="primary" id="serve">🍜 製作並提交</button> <button id="new">🔄 換單</button></div>
<div class="panel"><h3>🛒 技能商店</h3><div id="skills"></div></div>
</div>
<script>
const F={noodles:["🍜","麵條"],egg:["🥚","雞蛋"],pork:["🥩","叉燒"],corn:["🌽","玉米"],green:["🥬","青菜"],fish:["🍥","魚板"],mushroom:["🍄","香菇"]};
const keys=Object.keys(F);let s={coins:25,served:0,order:{},bag:{},speed:0,magnet:0,bonus:0};let interval;
function order(){s.order={};s.bag={};keys.sort(()=>Math.random()-.5).slice(0,2+Math.floor(Math.random()*2)).forEach(k=>s.order[k]=1);render()}
function render(){document.querySelector("#coins").textContent=s.coins;document.querySelector("#served").textContent=s.served;let o=document.querySelector("#order");o.innerHTML="";Object.keys(s.order).forEach(k=>{let d=document.createElement("span");d.className="tag "+((s.bag[k]||0)>=1?"done":"");d.textContent=F[k][0]+" "+F[k][1]+" "+Math.min(s.bag[k]||0,1)+"/1";o.appendChild(d)});let sk=document.querySelector("#skills");sk.innerHTML="";[["speed","⚡ 掉落速度",25],["magnet","🧲 收集範圍",35],["bonus","🪙 金幣加成",50]].forEach(x=>{let d=document.createElement("div");d.className="skill";let lv=s[x[0]],cost=x[2]*(lv+1);d.innerHTML="<b>"+x[1]+" Lv."+lv+"</b><div class='small'>升級需要 🪙 "+cost+"</div>";let b=document.createElement("button");b.textContent="升級";b.disabled=lv>=3||s.coins<cost;b.onclick=()=>{s.coins-=cost;s[x[0]]++;render();restart()};d.appendChild(b);sk.appendChild(d)})}
function spawn(){let k=keys[Math.floor(Math.random()*keys.length)],e=document.createElement("button");e.className="food";e.textContent=F[k][0];e.style.left=(4+Math.random()*90)+"%";document.querySelector("#field").appendChild(e);let y=-50,dead=false,last=performance.now(),v=1.2+s.speed*.25+Math.random()*.8;function a(t){if(dead)return;y+=v*(t-last)/16;last=t;e.style.top=y+"px";if(y<400)requestAnimationFrame(a);else{dead=true;e.remove()}}requestAnimationFrame(a);e.onclick=()=>{if(dead)return;dead=true;s.bag[k]=(s.bag[k]||0)+1;e.remove();render();document.querySelector("#msg").textContent="收集到 "+F[k][1]+"！"}}
function restart(){clearInterval(interval);interval=setInterval(spawn,Math.max(350,900-s.speed*120))}
document.querySelector("#serve").onclick=()=>{if(Object.keys(s.order).every(k=>(s.bag[k]||0)>=1)){let gain=20+s.bonus*5;s.coins+=gain;s.served++;document.querySelector("#msg").textContent="🍜 完成！獲得 🪙 "+gain;order()}else document.querySelector("#msg").textContent="還缺食材！繼續收集吧！"};
document.querySelector("#new").onclick=()=>{order();document.querySelector("#msg").textContent="新的客人來了！"};order();render();restart();for(let i=0;i<4;i++)setTimeout(spawn,i*250);
</script></body></html>
